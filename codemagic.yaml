workflows:

  # ─────────────────────────────────────────────────────────────
  # ANDROID — gera APK (debug) e AAB (release para Play Store)
  # ─────────────────────────────────────────────────────────────
  android-release:
    name: NETPLAY — Android Release
    max_build_duration: 60
    environment:
      node: 20.18.0
      vars:
        # ── API do servidor (use sempre o domínio .replit.app do deploy, NUNCA a URL de dev) ──
        API_DOMAIN: seuapp.replit.app        # ← SUBSTITUA pelo seu domínio deployed

        # ── TMDB ──────────────────────────────────────────────────────────────────────────────
        TMDB_API_KEY: "8f0beb08cf016ec8de49e454e09879ec"

        # ── Cloudflare R2 ─────────────────────────────────────────────────────────────────────
        R2_ACCOUNT_ID: "9827b92a6b3a621e8c6f50274e68f37b"
        R2_ACCESS_KEY_ID: "9e96806804e8815dfd9580ec062fa0c5"
        R2_SECRET_ACCESS_KEY: "COLE_AQUI_A_SECRET_KEY_COMPLETA"  # ← chave secreta do R2
        R2_BUCKET_NAME: "netplay-media-storage"

    scripts:
      - name: Instalar pnpm
        script: npm install -g pnpm --force

      - name: Instalar dependências do workspace
        script: pnpm install --no-frozen-lockfile
        working_directory: .

      - name: Instalar dependências do app mobile
        script: |
          cd artifacts/mobile
          npm install --legacy-peer-deps

      - name: Configurar variáveis de ambiente do Expo
        script: |
          cd artifacts/mobile
          echo "EXPO_PUBLIC_SUPABASE_URL=${SUPABASE_URL}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" >> .env
          echo "EXPO_PUBLIC_DOMAIN=${API_DOMAIN}" >> .env
          echo "EXPO_PUBLIC_TMDB_API_KEY=${TMDB_API_KEY}" >> .env
          echo "EXPO_PUBLIC_R2_ACCOUNT_ID=${R2_ACCOUNT_ID}" >> .env
          echo "EXPO_PUBLIC_R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}" >> .env
          echo "EXPO_PUBLIC_R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}" >> .env
          echo "EXPO_PUBLIC_R2_BUCKET_NAME=${R2_BUCKET_NAME}" >> .env

      - name: Versionar build automaticamente
        script: |
          cd artifacts/mobile
          BUILD_NUM=${CM_BUILD_NUMBER:-1}

          # Lê a última tag semver (formato vX.Y.Z) do git
          GIT_TAG=$(git describe --tags --match "v[0-9]*.[0-9]*.[0-9]*" --abbrev=0 2>/dev/null || echo "")
          SEMVER="${GIT_TAG#v}"   # remove o 'v' do início (v1.2.3 → 1.2.3)

          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));

            // ── version (semver da tag git) ──────────────────────────────────
            const semver = '${SEMVER}';
            const tagSrc = '${GIT_TAG}';
            if (semver && /^\d+\.\d+\.\d+$/.test(semver)) {
              console.log('version:', cfg.expo.version, '→', semver, '(tag ' + tagSrc + ')');
              cfg.expo.version = semver;
            } else {
              console.log('version: mantido em', cfg.expo.version, '(nenhuma tag semver encontrada)');
            }

            // ── versionCode / buildNumber (auto-incremental) ─────────────────
            cfg.expo.android = cfg.expo.android || {};
            cfg.expo.ios     = cfg.expo.ios     || {};
            const prevCode = cfg.expo.android.versionCode ?? 0;
            cfg.expo.android.versionCode = ${BUILD_NUM};
            cfg.expo.ios.buildNumber     = String(${BUILD_NUM});
            console.log('versionCode/buildNumber:', prevCode, '→', ${BUILD_NUM});

            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
          "

      - name: Expo Prebuild (gera pasta android/)
        script: |
          cd artifacts/mobile
          npx expo prebuild --clean --platform android --no-install
          npm install --legacy-peer-deps

      - name: Garantir buildConfig no build.gradle
        script: |
          node artifacts/mobile/scripts/ensure-build-config.js

      - name: Patch Android (ícone + cores)
        script: |
          bash artifacts/mobile/scripts/patch-android-colors.sh

      - name: Configurar keystore de assinatura
        script: |
          cd artifacts/mobile/android
          echo "$CM_KEYSTORE" | base64 --decode > keystore.jks
          cat >> gradle.properties << EOF
          KEYSTORE_PATH=../keystore.jks
          KEYSTORE_PASSWORD=${CM_KEYSTORE_PASSWORD}
          KEY_ALIAS=${CM_KEY_ALIAS}
          KEY_PASSWORD=${CM_KEY_PASSWORD}
          EOF

      - name: Build AAB (Play Store) + APK (instalação direta)
        script: |
          cd artifacts/mobile/android
          ./gradlew bundleRelease assembleRelease --no-daemon

    artifacts:
      - artifacts/mobile/android/app/build/outputs/bundle/release/*.aab
      - artifacts/mobile/android/app/build/outputs/apk/release/*.apk

    publishing:
      # ── Google Play Store ─────────────────────────────────────────────────────
      # Pré-requisito: adicionar em Codemagic > Environment variables (grupo "google"):
      #   GCLOUD_SERVICE_ACCOUNT_CREDENTIALS  → JSON da conta de serviço do Google Cloud
      #     (Google Play Console → Configurações → Acesso à API → Criar conta de serviço)
      #
      # A faixa "internal" envia para Teste Interno — você aprova manualmente antes
      # de promover para alpha/beta/produção no Play Console.
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal          # Teste Interno → promova para alpha/beta/produção pelo Play Console
        submit_as_draft: false   # já disponibiliza para os testadores internos
        changes_not_sent_for_review: false
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────────────────────
  # iOS — gera IPA para App Store / TestFlight
  # ─────────────────────────────────────────────────────────────
  ios-release:
    name: NETPLAY — iOS Release
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      node: 20.18.0
      xcode: 16.2
      cocoapods: default
      vars:
        BUNDLE_ID: com.netplay.app

        # ── API do servidor ────────────────────────────────────────────────────────────────────
        API_DOMAIN: seuapp.replit.app        # ← SUBSTITUA pelo seu domínio deployed

        # ── TMDB ──────────────────────────────────────────────────────────────────────────────
        TMDB_API_KEY: "8f0beb08cf016ec8de49e454e09879ec"

        # ── Cloudflare R2 ─────────────────────────────────────────────────────────────────────
        R2_ACCOUNT_ID: "9827b92a6b3a621e8c6f50274e68f37b"
        R2_ACCESS_KEY_ID: "9e96806804e8815dfd9580ec062fa0c5"
        R2_SECRET_ACCESS_KEY: "COLE_AQUI_A_SECRET_KEY_COMPLETA"  # ← chave secreta do R2
        R2_BUCKET_NAME: "netplay-media-storage"

    scripts:
      - name: Instalar pnpm
        script: npm install -g pnpm --force

      - name: Instalar dependências do workspace
        script: pnpm install --no-frozen-lockfile
        working_directory: .

      - name: Instalar dependências do app mobile
        script: |
          cd artifacts/mobile
          npm install --legacy-peer-deps

      - name: Configurar variáveis de ambiente do Expo
        script: |
          cd artifacts/mobile
          echo "EXPO_PUBLIC_SUPABASE_URL=${SUPABASE_URL}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" >> .env
          echo "EXPO_PUBLIC_DOMAIN=${API_DOMAIN}" >> .env
          echo "EXPO_PUBLIC_TMDB_API_KEY=${TMDB_API_KEY}" >> .env
          echo "EXPO_PUBLIC_R2_ACCOUNT_ID=${R2_ACCOUNT_ID}" >> .env
          echo "EXPO_PUBLIC_R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}" >> .env
          echo "EXPO_PUBLIC_R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}" >> .env
          echo "EXPO_PUBLIC_R2_BUCKET_NAME=${R2_BUCKET_NAME}" >> .env

      - name: Versionar build automaticamente
        script: |
          cd artifacts/mobile
          BUILD_NUM=${CM_BUILD_NUMBER:-1}

          # Lê a última tag semver (formato vX.Y.Z) do git
          GIT_TAG=$(git describe --tags --match "v[0-9]*.[0-9]*.[0-9]*" --abbrev=0 2>/dev/null || echo "")
          SEMVER="${GIT_TAG#v}"   # remove o 'v' do início (v1.2.3 → 1.2.3)

          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));

            // ── version (semver da tag git) ──────────────────────────────────
            const semver = '${SEMVER}';
            const tagSrc = '${GIT_TAG}';
            if (semver && /^\d+\.\d+\.\d+$/.test(semver)) {
              console.log('version:', cfg.expo.version, '→', semver, '(tag ' + tagSrc + ')');
              cfg.expo.version = semver;
            } else {
              console.log('version: mantido em', cfg.expo.version, '(nenhuma tag semver encontrada)');
            }

            // ── versionCode / buildNumber (auto-incremental) ─────────────────
            cfg.expo.android = cfg.expo.android || {};
            cfg.expo.ios     = cfg.expo.ios     || {};
            const prevBuild = cfg.expo.ios.buildNumber ?? '0';
            cfg.expo.android.versionCode = ${BUILD_NUM};
            cfg.expo.ios.buildNumber     = String(${BUILD_NUM});
            console.log('buildNumber:', prevBuild, '→', ${BUILD_NUM});

            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
          "

      - name: Expo Prebuild (gera pasta ios/)
        script: |
          cd artifacts/mobile
          npx expo prebuild --clean --platform ios --no-install
          npm install --legacy-peer-deps

      - name: Instalar pods
        script: |
          cd artifacts/mobile/ios
          pod install

      - name: Configurar code signing (App Store Connect API)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates

      - name: Build IPA
        script: |
          cd artifacts/mobile
          xcode-project build-ipa \
            --workspace ios/NETPLAY.xcworkspace \
            --scheme NETPLAY

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # ── TestFlight / App Store ─────────────────────────────────────────────────
      # Pré-requisito: adicionar em Codemagic > Environment variables (grupo "appstore"):
      #   APP_STORE_CONNECT_KEY_IDENTIFIER  → Key ID (ex: ABC123DEFG)
      #   APP_STORE_CONNECT_ISSUER_ID       → Issuer ID (UUID)
      #   APP_STORE_CONNECT_PRIVATE_KEY     → Conteúdo do arquivo .p8 (App Store Connect API)
      #   CERTIFICATE_PRIVATE_KEY           → Chave privada do certificado de distribuição
      #
      # O build vai para TestFlight automaticamente. Aprovação manual para App Store.
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true   # envia para TestFlight automaticamente
        submit_to_app_store: false   # submissão para App Store é manual
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────────────────────
  # EAS BUILD — alternativa usando Expo Application Services
  # Variáveis necessárias (cadastrar em Codemagic > Environment variables):
  #   EXPO_TOKEN, SUPABASE_URL, SUPABASE_ANON_KEY
  # ─────────────────────────────────────────────────────────────
  eas-build:
    name: NETPLAY — EAS Build
    max_build_duration: 60
    environment:
      node: 20.18.0
      vars:
        EAS_PROJECT_ID: aa86cc57-e8c0-4ce7-806c-0d1e5e345991

        # ── API do servidor ────────────────────────────────────────────────────────────────────
        API_DOMAIN: seuapp.replit.app        # ← SUBSTITUA pelo seu domínio deployed

        # ── TMDB ──────────────────────────────────────────────────────────────────────────────
        TMDB_API_KEY: "8f0beb08cf016ec8de49e454e09879ec"

        # ── Cloudflare R2 ─────────────────────────────────────────────────────────────────────
        R2_ACCOUNT_ID: "9827b92a6b3a621e8c6f50274e68f37b"
        R2_ACCESS_KEY_ID: "9e96806804e8815dfd9580ec062fa0c5"
        R2_SECRET_ACCESS_KEY: "COLE_AQUI_A_SECRET_KEY_COMPLETA"  # ← chave secreta do R2
        R2_BUCKET_NAME: "netplay-media-storage"

    scripts:
      - name: Instalar pnpm
        script: npm install -g pnpm --force

      - name: Instalar dependências
        script: pnpm install --frozen-lockfile

      - name: Configurar variáveis de ambiente do Expo
        script: |
          cd artifacts/mobile
          echo "EXPO_PUBLIC_SUPABASE_URL=${SUPABASE_URL}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" >> .env
          echo "EXPO_PUBLIC_DOMAIN=${API_DOMAIN}" >> .env
          echo "EXPO_PUBLIC_TMDB_API_KEY=${TMDB_API_KEY}" >> .env
          echo "EXPO_PUBLIC_R2_ACCOUNT_ID=${R2_ACCOUNT_ID}" >> .env
          echo "EXPO_PUBLIC_R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}" >> .env
          echo "EXPO_PUBLIC_R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}" >> .env
          echo "EXPO_PUBLIC_R2_BUCKET_NAME=${R2_BUCKET_NAME}" >> .env

      - name: Instalar EAS CLI
        script: npm install -g eas-cli

      - name: Login no Expo
        script: eas login --token $EXPO_TOKEN

      - name: EAS Build Android
        script: |
          cd artifacts/mobile
          eas build --platform android --profile production --non-interactive

      - name: EAS Build iOS
        script: |
          cd artifacts/mobile
          eas build --platform ios --profile production --non-interactive

    artifacts:
      - "**/*.apk"
      - "**/*.aab"
      - "**/*.ipa"
