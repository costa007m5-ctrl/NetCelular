<!doctype html>
<html>
  <head>
    <title>APP_NAME_PLACEHOLDER</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg width='180' height='180' viewBox='0 0 180 180' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='180' height='180' rx='36' fill='%23e50914'/%3E%3Cpath d='M54 54h22l20 32 20-32h22L108 90l30 36h-22l-20-32-20 32H54l30-36L54 54z' fill='white'/%3E%3C/svg%3E" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0a0a0a;
        color: #e0e0e0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 20px;
      }
      .wrapper {
        max-width: 480px;
        width: 100%;
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 16px;
        border-radius: 18px;
        background: #e50914;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo svg { width: 44px; height: 44px; }
      h1 {
        font-size: 28px;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.5px;
        margin-bottom: 6px;
      }
      .subtitle {
        font-size: 14px;
        color: #666;
        margin-bottom: 32px;
      }
      .cards {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      @media (min-width: 560px) {
        .cards { flex-direction: row; }
      }
      .card {
        flex: 1;
        background: #161616;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 24px 20px;
        text-align: center;
      }
      .card-num {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1px solid #444;
        color: #888;
        font-size: 13px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 12px;
      }
      .card-title {
        font-size: 16px;
        font-weight: 600;
        color: #f0f0f0;
        margin-bottom: 8px;
      }
      .card-desc {
        font-size: 13px;
        color: #666;
        margin-bottom: 18px;
        line-height: 1.5;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        transition: opacity 0.15s;
        cursor: pointer;
        border: none;
      }
      .btn:hover { opacity: 0.85; }
      .btn-dark {
        background: #222;
        color: #e0e0e0;
        border: 1px solid #333;
        margin-bottom: 8px;
      }
      .btn-red {
        background: #e50914;
        color: #fff;
      }
      .btn-link {
        background: none;
        color: #555;
        font-size: 12px;
        padding: 6px;
        margin-top: 2px;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .qr-card {
        background: #111;
        border-color: #2a2a2a;
      }
      #qr-wrap {
        background: #fff;
        border-radius: 12px;
        padding: 12px;
        display: inline-block;
        margin-bottom: 16px;
      }
      #qr-canvas {
        display: block;
        width: 160px;
        height: 160px;
      }
      .open-expo-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        background: #fff;
        color: #111;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: opacity 0.15s;
      }
      .open-expo-btn:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="logo">
        <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 7h10l9 14.5L35 7h10L36 22l9 15H35l-9-14.5L17 37H7l9-15L7 7z" fill="white"/>
        </svg>
      </div>
      <h1>APP_NAME_PLACEHOLDER</h1>
      <p class="subtitle">Abra no celular com o Expo Go</p>

      <div class="cards">
        <div class="card">
          <div class="card-num">1</div>
          <div class="card-title">Instale o Expo Go</div>
          <p class="card-desc">App gratuito para testar aplicativos Expo</p>
          <a id="btn-android" href="https://play.google.com/store/apps/details?id=host.exp.exponent" class="btn btn-dark" target="_blank">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/></svg>
            Google Play
          </a>
          <a id="btn-ios" href="https://apps.apple.com/app/id982107779" class="btn btn-dark" target="_blank">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
            App Store
          </a>
        </div>

        <div class="card qr-card">
          <div class="card-num">2</div>
          <div class="card-title">Escaneie o QR Code</div>
          <p class="card-desc">Use a câmera ou o Expo Go</p>
          <div id="qr-wrap">
            <canvas id="qr-canvas" width="160" height="160"></canvas>
          </div>
          <br/>
          <a id="open-expo" href="exps://EXPS_URL_PLACEHOLDER" class="open-expo-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Abrir no Expo Go
          </a>
        </div>
      </div>
    </div>

    <script>
    (function() {
      // ── QR code generator (no CDN dependency) ──────────────────────────────
      function drawQr(canvasEl, text, size) {
        var s = size || 160;
        canvasEl.width = s; canvasEl.height = s;
        var ctx = canvasEl.getContext("2d");
        if (!ctx) return;

        // Minimal QR via a public API rendered as image
        var img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = function() { ctx.drawImage(img, 0, 0, s, s); };
        img.onerror = function() {
          // Fallback: show URL text
          ctx.fillStyle = "#fff";
          ctx.fillRect(0,0,s,s);
          ctx.fillStyle = "#000";
          ctx.font = "10px monospace";
          ctx.textAlign = "center";
          ctx.fillText("QR indisponível", s/2, s/2 - 8);
          ctx.fillText("Use o botão abaixo", s/2, s/2 + 8);
        };
        img.src = "https://api.qrserver.com/v1/create-qr-code/?size=" + s + "x" + s + "&data=" + encodeURIComponent(text) + "&bgcolor=ffffff&color=000000&format=png&ecc=H";
      }

      var deepLink = "exps://EXPS_URL_PLACEHOLDER";
      var canvas = document.getElementById("qr-canvas");
      if (canvas) drawQr(canvas, deepLink, 160);

      // ── Platform detection: adjust store buttons ─────────────────────────
      var ua = navigator.userAgent;
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      var btnAndroid = document.getElementById("btn-android");
      var btnIos = document.getElementById("btn-ios");

      if (isIOS) {
        // Prioritize iOS button
        btnAndroid.className = "btn btn-link";
      } else if (isAndroid) {
        // Prioritize Android button
        btnIos.className = "btn btn-link";
      }

      // ── Try opening Expo Go silently (no page redirect, no blank screen) ──
      var openBtn = document.getElementById("open-expo");
      if (openBtn) {
        openBtn.addEventListener("click", function(e) {
          e.preventDefault();
          // Use iframe trick to avoid navigating away from the page
          var iframe = document.createElement("iframe");
          iframe.style.display = "none";
          document.body.appendChild(iframe);
          try { iframe.src = deepLink; } catch(x) {}
          setTimeout(function() {
            try { document.body.removeChild(iframe); } catch(x) {}
          }, 2000);
          // Also try direct navigation as fallback after a delay
          setTimeout(function() {
            window.location.href = deepLink;
          }, 300);
        });
      }
    })();
    </script>
  </body>
</html>
