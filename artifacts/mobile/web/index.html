<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
  <title>NETPLAY</title>
  <meta name="description" content="Descubra e assista aos melhores filmes e séries em streaming." />
  <meta name="theme-color" content="#e50914" />
  <link rel="icon" type="image/png" href="/assets/images/icon.png" />
  <style>
    :root{
      --red:#ff2034;
      --red-soft:#ff6672;
      --white:#f6f7f8;
      --muted:rgba(255,255,255,.32);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#000}

    #root{width:100%;height:100%}

    #netplay-splash{
      position:fixed;
      inset:0;
      z-index:99999;
      display:grid;
      place-items:center;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      color:#fff;
      background:
        radial-gradient(circle at 50% 42%, rgba(255,36,52,.14), transparent 26%),
        linear-gradient(180deg, #090103 0%, #030001 55%, #000 100%);
      transition:opacity .45s ease, visibility .45s ease;
    }
    #netplay-splash.hidden{opacity:0;visibility:hidden;pointer-events:none}

    .screen{
      position:relative;
      width:100vw;height:100vh;min-height:100svh;
      overflow:hidden;display:grid;place-items:center;isolation:isolate;
    }
    .screen::before{
      content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(circle at center, transparent 0 40%, rgba(0,0,0,.24) 76%, rgba(0,0,0,.70) 100%),
        linear-gradient(180deg, rgba(255,255,255,.03), transparent 16%, transparent 84%, rgba(0,0,0,.24));
    }
    .screen::after{
      content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.08;
      background:repeating-linear-gradient(180deg,rgba(255,255,255,.017) 0px,rgba(255,255,255,.017) 1px,transparent 1px,transparent 8px);
      animation:scan 10s linear infinite;
    }
    .ambient{position:absolute;inset:0;z-index:1;display:grid;place-items:center;pointer-events:none}
    .ambient-glow{
      position:absolute;width:min(60vw, 420px);height:min(60vw, 420px);border-radius:50%;
      background:radial-gradient(circle, rgba(255,30,45,.20), rgba(255,30,45,.08) 42%, rgba(255,30,45,0) 72%);
      filter:blur(14px);animation:bgPulse 3.2s ease-in-out infinite;
    }
    .ring{position:absolute;border-radius:50%;border:1px solid rgba(255,36,52,.11);background:rgba(255,0,0,.015);animation:ringPulse 4.8s ease-in-out infinite}
    .ring.r1{width:min(76vw, 470px);height:min(76vw, 470px)}
    .ring.r2{width:min(56vw, 340px);height:min(56vw, 340px);animation-delay:.24s}
    .ring.r3{width:min(38vw, 220px);height:min(38vw, 220px);animation-delay:.48s}
    .light-sweep{
      position:absolute;inset:-8% -35%;
      background:linear-gradient(90deg, transparent 38%, rgba(255,255,255,.05) 50%, transparent 62%);
      filter:blur(14px);transform:translateX(-60%) rotate(-10deg);opacity:0;animation:sweep 4.8s ease-in-out infinite;
    }
    .particles{position:absolute;inset:0;z-index:1;pointer-events:none}
    .p{
      position:absolute;width:4px;height:4px;border-radius:50%;
      background:rgba(255,110,120,.88);box-shadow:0 0 10px rgba(255,70,90,.36);
      opacity:0;animation:particle 6.8s ease-in-out infinite;
    }
    .p:nth-child(1){left:19%;top:34%;animation-delay:.2s}
    .p:nth-child(2){left:30%;top:67%;animation-delay:.9s}
    .p:nth-child(3){left:42%;top:25%;animation-delay:.5s}
    .p:nth-child(4){left:63%;top:24%;animation-delay:1.1s}
    .p:nth-child(5){left:77%;top:66%;animation-delay:.75s}
    .p:nth-child(6){left:58%;top:73%;animation-delay:1.35s}
    .loader-wrap{
      position:relative;z-index:3;width:min(86vw, 290px);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:18px;transform:translateY(-1vh);animation:intro .9s cubic-bezier(.2,.9,.2,1) both;
    }
    .loader{position:relative;width:128px;height:128px;display:grid;place-items:center}
    .halo{
      position:absolute;inset:-18px;border-radius:50%;
      background:radial-gradient(circle, rgba(255,45,60,.23), rgba(255,45,60,.08) 40%, rgba(255,45,60,0) 72%);
      filter:blur(12px);animation:halo 2.2s ease-in-out infinite;
    }
    .track{position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
    .arc{position:absolute;border-radius:50%;border:4px solid transparent;filter:drop-shadow(0 0 12px rgba(255,40,55,.24))}
    .arc.a1{inset:0;border-top-color:var(--red);border-right-color:var(--red-soft);animation:spin 1.05s linear infinite}
    .arc.a2{inset:12px;border-width:3px;border-bottom-color:rgba(255,105,116,.88);border-left-color:rgba(255,31,51,.78);animation:spinReverse 1.75s linear infinite}
    .arc.a3{inset:22px;border-width:2px;border-top-color:rgba(255,255,255,.16);border-right-color:rgba(255,255,255,.05);animation:spin 2.4s linear infinite;opacity:.7}
    .orbit{position:absolute;inset:0;animation:spin 5s linear infinite}
    .orbit span{
      position:absolute;top:4px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;
      background:linear-gradient(180deg, var(--red-soft), var(--red));box-shadow:0 0 12px rgba(255,45,60,.30);
    }
    .center{
      position:relative;width:68px;height:68px;border-radius:22px;overflow:hidden;
      display:grid;place-items:center;
      background:linear-gradient(180deg, #ff4c58 0%, #f40408 46%, #980008 100%);
      box-shadow:0 10px 24px rgba(0,0,0,.34),0 0 26px rgba(255,35,50,.15),inset 0 1px 0 rgba(255,255,255,.24),inset 0 -1px 0 rgba(0,0,0,.20);
      animation:centerPulse 2s ease-in-out infinite;
    }
    .center::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0))}
    .center::after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
      transform:translateX(-150%) skewX(-18deg);animation:shine 2.5s ease-in-out infinite;
    }
    .n{
      position:relative;z-index:1;
      font-family:"Arial Black", Impact, Inter, Arial, sans-serif;
      font-size:40px;line-height:1;font-weight:900;letter-spacing:-.05em;
      color:var(--white);transform:translateY(-1px);text-shadow:0 2px 8px rgba(0,0,0,.12);
      animation:nPulse 1.9s ease-in-out infinite;
    }
    .play{
      position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;
      background:#f5f5f7;display:grid;place-items:center;z-index:2;box-shadow:0 4px 10px rgba(0,0,0,.24);
      animation:playPulse 1.9s ease-in-out infinite;
    }
    .play::before{content:"";width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid #df1e2d;margin-left:2px}
    .equalizer{display:flex;align-items:flex-end;justify-content:center;gap:7px;height:18px}
    .equalizer span{
      width:7px;border-radius:999px;
      background:linear-gradient(180deg, var(--red-soft), var(--red));
      box-shadow:0 0 10px rgba(255,50,65,.18);animation:bars 1s ease-in-out infinite;
    }
    .equalizer span:nth-child(1){height:8px;animation-delay:0s}
    .equalizer span:nth-child(2){height:16px;animation-delay:.12s}
    .equalizer span:nth-child(3){height:11px;animation-delay:.24s}
    .equalizer span:nth-child(4){height:16px;animation-delay:.36s}
    .equalizer span:nth-child(5){height:8px;animation-delay:.48s}
    .text{text-align:center;color:var(--muted);font-size:clamp(15px,3.6vw,19px);font-weight:600;line-height:1.35;animation:textPulse 1.9s ease-in-out infinite}
    .text strong{color:rgba(255,255,255,.84);font-weight:700}
    .sub{margin-top:-6px;text-align:center;color:rgba(255,255,255,.14);font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
    .dots::after{content:"";animation:dots 1.3s steps(4,end) infinite}

    @keyframes intro{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:translateY(-1vh) scale(1)}}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(8px)}}
    @keyframes bgPulse{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.08);opacity:1}}
    @keyframes ringPulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.03);opacity:.55}}
    @keyframes sweep{0%,16%{opacity:0;transform:translateX(-60%) rotate(-10deg)}26%{opacity:.95}42%,100%{opacity:0;transform:translateX(60%) rotate(-10deg)}}
    @keyframes particle{0%,100%{opacity:0;transform:translateY(8px) scale(.72)}25%{opacity:.75}70%{opacity:.36}100%{opacity:0;transform:translateY(-20px) scale(1.06)}}
    @keyframes halo{0%,100%{transform:scale(1);opacity:.72}50%{transform:scale(1.10);opacity:1}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes spinReverse{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
    @keyframes centerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    @keyframes shine{0%,56%{transform:translateX(-150%) skewX(-18deg)}72%,100%{transform:translateX(150%) skewX(-18deg)}}
    @keyframes nPulse{0%,100%{transform:translateY(-1px) scale(1)}50%{transform:translateY(-1px) scale(1.05)}}
    @keyframes playPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    @keyframes bars{0%,100%{transform:scaleY(.72);opacity:.55}50%{transform:scaleY(1.26);opacity:1}}
    @keyframes textPulse{0%,100%{opacity:.58}50%{opacity:1}}
    @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}100%{content:""}}
  </style>
</head>
<body>
  <div id="netplay-splash" role="status" aria-label="Carregando NETPLAY">
    <main class="screen">
      <div class="ambient" aria-hidden="true">
        <div class="ambient-glow"></div>
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="light-sweep"></div>
      </div>
      <div class="particles" aria-hidden="true">
        <span class="p"></span><span class="p"></span><span class="p"></span>
        <span class="p"></span><span class="p"></span><span class="p"></span>
      </div>
      <section class="loader-wrap">
        <div class="loader">
          <div class="halo"></div>
          <div class="track"></div>
          <div class="arc a1"></div>
          <div class="arc a2"></div>
          <div class="arc a3"></div>
          <div class="orbit"><span></span></div>
          <div class="center">
            <div class="n">N</div>
            <div class="play"></div>
          </div>
        </div>
        <div class="equalizer" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="text"><strong>Carregando</strong><span class="dots"></span></div>
        <div class="sub">netplay streaming</div>
      </section>
    </main>
  </div>

  <div id="root"></div>

  <script>
    (function() {
      var splash = document.getElementById('netplay-splash');
      var hidden = false;
      function hideSplash() {
        if (hidden) return;
        hidden = true;
        splash.classList.add('hidden');
        setTimeout(function() {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 500);
      }
      var observer = new MutationObserver(function() {
        var root = document.getElementById('root');
        if (root && root.children.length > 0) {
          setTimeout(hideSplash, 300);
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true, subtree: false });
      setTimeout(hideSplash, 12000);
    })();
  </script>
</body>
</html>
